<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>証券管理ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260827-1757" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">証</div>
        <div>
          <div class="brand-name">証券管理</div>
          <div class="brand-sub">PORTFOLIO</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">ダッシュボード</h1>
        <div class="topbar-spacer"></div>
        <div class="tickers" id="tickers"></div>
        <div class="tdiv"></div>
        <div id="login-warn" hidden></div>
        <div class="update-meta" id="update-meta">更新<br /><b>—</b></div>
        <button id="btn-refresh" class="btn btn-primary">価格更新</button>
      </header>
      <!-- 決算日バックグラウンド取得の進捗バー（操作はブロックしない。app.js の earnProgress が表示/更新） -->
      <div id="earn-progress" class="earn-progress" hidden>
        <span id="earn-progress-text" class="earn-progress-text">決算日を取得中…</span>
        <div class="earn-progress-track"><div id="earn-progress-fill" class="earn-progress-fill"></div></div>
      </div>
      <main class="content"><div id="app"></div></main>
    </div>
  </div>

  <!-- 汎用モーダル -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-title">タイトル</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 銘柄詳細ドロワー（右からスライド） -->
  <div id="drawer-overlay" class="drawer-overlay" hidden>
    <aside class="drawer" id="detail-drawer" role="dialog" aria-modal="true">
      <div class="drawer-head">
        <div class="top">
          <div style="min-width:0;flex:1">
            <h2 class="drawer-title" id="drawer-title">銘柄</h2>
            <div id="drawer-subtitle" style="display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap"></div>
          </div>
          <button class="x-btn x" id="drawer-close" title="閉じる">&times;</button>
        </div>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-foot" id="drawer-foot"></div>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 処理中／完了オーバーレイ（ボタン操作のフィードバック） -->
  <div id="busy-overlay" class="busy-overlay" hidden>
    <div class="busy-card">
      <div class="busy-spinner" id="busy-spinner"></div>
      <div class="busy-msg" id="busy-msg">処理中…</div>
    </div>
  </div>

  <script src="sync-merge.js?v=20260825-1542"></script>
  <script src="analysis.js?v=20260729-2142"></script>
  <script src="app.js?v=20260827-1757"></script>
</body>
</html>
