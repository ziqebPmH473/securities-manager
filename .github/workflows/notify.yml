name: 買い増しサイン通知

# 市場別の定時に /api/notify-run?send=1 を叩いてメール通知する（N4）。
# 時刻はUTC指定（JST = UTC+9）。GitHubの定時実行は数分遅延することがある。
on:
  schedule:
    - cron: '45 22 * * *'   # 日本株  7:45 JST
    - cron: '0 2 * * *'     # 日本株 11:00 JST
    - cron: '0 8 * * *'     # 日本株 17:00 JST
    - cron: '0 15 * * *'    # 米国株  0:00 JST
    - cron: '0 22 * * *'    # 米国株  7:00 JST
  workflow_dispatch:        # 手動テスト用
    inputs:
      market:
        description: '市場（JP / US / 空=全市場）'
        required: false
        default: ''

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 通知をトリガー
        env:
          BASE_URL: https://securities-manager-9fno6acdqirgdgb76qks.pages.dev
          TOKEN: ${{ secrets.NOTIFY_TRIGGER_TOKEN }}
          SCHED: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
        run: |
          set -euo pipefail
          # どの cron で起動したかで市場を決定（米国株時刻=US / それ以外=JP / 手動は入力値）
          case "${SCHED}" in
            "0 15 * * *"|"0 22 * * *") MARKET="US" ;;
            "") MARKET="${INPUT_MARKET}" ;;
            *) MARKET="JP" ;;
          esac
          URL="${BASE_URL}/api/notify-run?send=1"
          if [ -n "${MARKET}" ]; then URL="${URL}&market=${MARKET}"; fi
          if [ -n "${TOKEN}" ]; then URL="${URL}&token=${TOKEN}"; fi
          echo "GET /api/notify-run?send=1&market=${MARKET:-ALL}（token隠蔽）"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' "${URL}")
          echo "HTTP ${code}"
          cat /tmp/out.json || true
          test "${code}" = "200"
